<div class="settings-backdrop" data-settings-backdrop hidden></div>
<section id="settings" class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title" data-settings-panel hidden>
  <div class="settings-heading"><div><h2 id="settings-title">Appearance</h2></div><button class="close-button" type="button" data-close-settings aria-label="Close appearance settings">×</button></div>
  <div class="settings-group"><span class="settings-label">Color theme</span><div class="segmented-control" role="group" aria-label="Color theme"><button type="button" data-theme-choice="light" aria-pressed="true">Light</button><button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button></div></div>
  <div class="settings-group"><span class="settings-label">Text and interface size</span><div class="segmented-control" role="group" aria-label="Text size"><button type="button" data-font-choice="small" aria-pressed="false">Small</button><button type="button" data-font-choice="medium" aria-pressed="true">Medium</button><button type="button" data-font-choice="large" aria-pressed="false">Large</button></div></div>
  <button type="button" class="button button-primary button-full" data-close-settings>Done</button>
</section>
